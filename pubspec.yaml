name: grocease
description: "GrocEase - Shop together. Split smarter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # UI & Design System
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2

  # State Management & Navigation
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1

  # Firebase Suite
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  cloud_functions: ^5.3.4
  firebase_messaging: ^15.2.4
  firebase_app_check: ^0.3.2+4

  # Hardware & Media
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  shared_preferences: ^2.5.6
  file_picker: ^13.1.0
  pdfx: ^2.11.0
  image: ^4.12.0
  flutter_local_notifications: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.4
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true
  generate: true
